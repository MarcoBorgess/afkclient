<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFK Client</title>
<style>
  :root { color-scheme: dark; --bg: #16181d; --panel: #20232a; --line: #343842; --text: #e6e8ec; --dim: #9aa1ad; --accent: #5fb878; --bad: #e06c6c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  form { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  h1 { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; margin: 0 0 4px; }
  h1 img { height: 24px; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); }
  input { background: #14161a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; }
  button { background: #2f6b43; color: var(--text); border: 1px solid var(--accent); border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #error { color: var(--bad); }
  #error:empty { display: none; }
</style>
</head>
<body>
<form id="form">
  <h1><img src="/cat-cream.png" alt=""> AFK Client <img src="/cat-tabby.png" alt=""></h1>
  <label>Username <input id="name" autocomplete="username" autocapitalize="none" autofocus required></label>
  <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
  <div id="error" role="alert"></div>
  <button>Log in</button>
</form>
<script>
const $ = id => document.getElementById(id)
$('form').onsubmit = async e => {
  e.preventDefault()
  $('error').textContent = ''
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value, password: $('password').value }) })
    if (res.ok) return location.replace('/')
    $('error').textContent = (await res.json()).error
  } catch {
    $('error').textContent = 'Could not reach the server'
  }
}
</script>
</body>
</html>
